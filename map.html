<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Astana IT University location</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body { font-family: Arial, Helvetica, sans-serif; color: #2e2420; }
    figure { position: relative; height: 100%; margin: 0; overflow: hidden; }
    img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .address, figcaption { position: absolute; background: #fff; padding: 6px 10px; font-size: 12px; }
    .address { top: 10px; left: 10px; margin: 0; }
    figcaption { right: 0; bottom: 0; max-width: calc(100% - 20px); font-size: 9px; line-height: 1.3; }
    a { color: #2e2420; }
  </style>
</head>
<body>
  <figure>
    <img src="images/location-map.png" alt="Map of the EXPO area with Astana IT University marked in Block C1">
    <p class="address">Mangilik El 55/11, Block C1, Astana</p>
    <figcaption>&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap contributors</a></figcaption>
  </figure>
</body>
</html>
